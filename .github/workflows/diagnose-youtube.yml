name: Diagnose YouTube formats

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yt-dlp and PO token provider
        run: |
          python -m pip install --upgrade --pre "yt-dlp[default]" bgutil-ytdlp-pot-provider==2.0.2
          git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - name: Inspect available YouTube clients
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          import yt_dlp

          video_id = os.environ["VIDEO_ID"]
          cookie_text = os.environ.get("YOUTUBE_COOKIES", "").strip()
          cookie_path = None
          if cookie_text:
              fd, cookie_path = tempfile.mkstemp(suffix=".cookies")
              with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                  f.write(cookie_text + "\n")

          print(f"yt_dlp_version={yt_dlp.version.__version__}")
          print(f"cookies_configured={bool(cookie_path)}")
          class SafeLogger:
              def __init__(self):
                  self.messages = []
              def debug(self, message):
                  self.messages.append(str(message).lower())
              def warning(self, message):
                  self.messages.append(str(message).lower())
              def error(self, message):
                  self.messages.append(str(message).lower())

          for client in ("mweb", "web_safari", "tv", "android", "ios", "default", "web", "web_embedded"):
              safe_logger = SafeLogger()
              opts = {
                  "quiet": True,
                  "verbose": True,
                  "logger": safe_logger,
                  "ignore_no_formats_error": True,
                  "socket_timeout": 25,
                  "extractor_args": {
                      "youtube": {"player_client": [client], "skip": ["translated_subs"]}
                  },
              }
              if cookie_path:
                  opts["cookiefile"] = cookie_path
              try:
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      info = ydl.extract_info(
                          f"https://www.youtube.com/watch?v={video_id}", download=False
                      )
                  formats = info.get("formats") or []
                  summary = ",".join(
                      f"{f.get('format_id')}:{f.get('height') or 'audio'}:{f.get('ext')}"
                      for f in formats[:8]
                  )
                  outcome = f"formats={len(formats)} sample={summary or 'none'}"
              except Exception as e:
                  outcome = f"error={type(e).__name__}: {str(e)[:180]}"

              messages = safe_logger.messages
              providers_loaded = any("po token providers:" in message for message in messages)
              token_requested = any("generating a" in message and "po token" in message for message in messages)
              cookie_recognized = any("account cookies" in message for message in messages)
              sign_in_challenge = any("sign in to confirm" in message or "login_required" in message for message in messages)
              print(
                  f"client={client} {outcome} po_provider_loaded={providers_loaded} "
                  f"po_token_requested={token_requested} account_cookies_recognized={cookie_recognized} "
                  f"sign_in_challenge={sign_in_challenge}"
              )

          if cookie_path:
              Path(cookie_path).unlink(missing_ok=True)
          PY
