name: Run Bot 24/7

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch: {}

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install YouTube PO Token provider
        run: |
          git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update yt-dlp to nightly
        run: python -m pip install --upgrade --pre yt-dlp

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PROXY_URL: ""
          USE_LOCAL_BOT_API: "false"
          PORT: "8000"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data downloads temp logs
          python main.py
